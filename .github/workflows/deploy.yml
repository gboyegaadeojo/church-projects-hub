# Production deploy (NFR-6, NFR-7, section 18): after CI passes on main, apply D1 migrations, then deploy.
# Blocked from Saturday 6 pm to Sunday 2 pm Winnipeg time; re-run it (or use "Run workflow") after the window.
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets; skips with a warning until they exist.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One production deploy at a time, in order.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Deploy skipped: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (README, Deploys)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: config
    if: needs.config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://church-projects-hub.media-5f7.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the Sunday freeze window (NFR-6)
        run: node scripts/ops-window-cli.ts deploy
      - run: npm ci
      - run: npm run build
      - name: Apply D1 migrations to production
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy the Worker
        run: npx wrangler deploy --message "${GITHUB_SHA_DEPLOYED::7} via GitHub Actions run ${{ github.run_id }}"
        env:
          GITHUB_SHA_DEPLOYED: ${{ github.event.workflow_run.head_sha || github.sha }}
