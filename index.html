<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Church Projects Hub</title>
    <!--
      Applies the saved theme before first paint so there is no flash (section 9).
      Keep the storage key and logic in sync with src/theme/theme.ts.
    -->
    <script>
      (function () {
        var pref = "system";
        try {
          var saved = localStorage.getItem("cph-theme");
          if (saved === "light" || saved === "dark") pref = saved;
        } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
